name: BBN
description: >-
  BBN (RTX BBN Technologies, formerly BBN Technologies and Raytheon BBN) is an
  American research and development organization based in Cambridge,
  Massachusetts, founded in 1948 and now a division of RTX Corporation. BBN has a
  storied history in computer networking, having built the original ARPANET
  Interface Message Processors and pioneered early email. Today it delivers
  advanced technology for national security across AI and machine learning,
  all-domain command and control, applied biosciences, cyber operations, spectrum
  dominance, maritime autonomy, multi-domain sensing, resilient networking,
  planning and logistics, quantum and photonics, and voice and language
  processing. General Catalyst has backed BBN since 2004. BBN serves government
  and defense customers and does not publish a public developer API, SDK, or
  developer portal.
